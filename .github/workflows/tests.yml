name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run the tool on the sample data
        run: |
          PYTHONPATH=src python -m grc_assess samples/example_manufacturer_weak.json --out reports
          PYTHONPATH=src python -m grc_assess samples/example_cold_storage_mature.json --out reports --fail-on high
